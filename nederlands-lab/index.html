</div>

<div class="app" id="app" hidden>

      <button class="icon-btn" id="syncBtn" type="button" title="Synchronisatie" aria-label="Synchronisatie">

      <a href="#/" data-nav="home"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V21H3z"/></svg><span>Start</span></a>
